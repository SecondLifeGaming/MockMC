name: Build
 
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'build-and-docs'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run generator
        run: ./gradlew :metaminer:runGenerator

      - name: Apply Spotless formatting
        run: ./gradlew spotlessApply

      - name: Run unit tests
        timeout-minutes: 160
        run: ./gradlew testAllBackends --refresh-dependencies

      - name: Upload Generated Documentation Data Artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-doc-data
          path: site/docs/public/data/
          retention-days: 1

  docs:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Download Generated Documentation Data Artifact
        uses: actions/download-artifact@v4
        with:
          name: site-doc-data
          path: site/docs/public/data/

      - name: Validate Generated Documentation Data
        run: |
          test -s site/docs/public/data/explorer-meta.json || { echo "explorer-meta.json is missing or empty!"; exit 1; }
          test -s site/docs/public/data/search-index.json || { echo "search-index.json is missing or empty!"; exit 1; }
          test -s site/docs/public/data/changed-symbols.json || { echo "changed-symbols.json is missing or empty!"; exit 1; }
          test -s site/docs/public/data/first-page.json || { echo "first-page.json is missing or empty!"; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'site/package-lock.json'

      - name: Install Site Dependencies
        working-directory: site
        run: npm ci

      - name: Build VitePress Site (with dead-link checks)
        working-directory: site
        run: npm run docs:build

      - name: Upload PR Site Preview Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vitepress-preview-site
          path: site/docs/.vitepress/dist
          retention-days: 5

      - name: Upload GitHub Pages Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/docs/.vitepress/dist

  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
